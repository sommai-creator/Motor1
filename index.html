<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>AR 3 Pla Tapian - Forward Swimming</title>
    
    <!-- นำเข้า A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
        // ควบคุมพฤติกรรมการว่ายของปลาตะเพียนทั้ง 3 ตัว
        AFRAME.registerComponent('fish-controller', {
            init: function() {
                this.speedMultiplier = 1;
                this.orbitAngle = 0;
                this.bobAngle = 0;
                this.tailAngle = 0;
            },
            setSpeed: function(speed) {
                this.speedMultiplier = speed;
            },
            tick: function(time, timeDelta) {
                let dt = timeDelta / 1000;

                // 1. ว่ายวนรอบ Marker
                this.orbitAngle += 30 * this.speedMultiplier * dt; 
                let orbit = document.querySelector('#swimming-orbit');
                if(orbit) orbit.setAttribute('rotation', `0 ${this.orbitAngle} 0`);

                // 2. เคลื่อนที่ขึ้นลง (พร้อมกันทั้ง 3 ตัว)
                this.bobAngle += 2 * Math.PI * (0.4 * this.speedMultiplier) * dt; 
                let yPos = 1.2 + Math.sin(this.bobAngle) * 0.4; 
                let centers = document.querySelectorAll('.fish-center');
                centers.forEach(center => {
                    center.setAttribute('position', `1.5 ${yPos} 0`);
                });

                // 3. ส่ายตัวว่ายน้ำ (แทนการสะบัดหาง)
                this.tailAngle += 2 * Math.PI * (1.5 * this.speedMultiplier) * dt; 
                // หันหน้า 90 องศาตามวงโคจร และส่ายบวกลบ 15 องศา
                let wag = 90 + (Math.sin(this.tailAngle) * 15); 
                let fishes = document.querySelectorAll('.fish-image');
                fishes.forEach(fish => {
                    fish.setAttribute('rotation', `0 ${wag} 0`);
                });
            }
        });

        // ฟังก์ชันรับคำสั่งจากปุ่ม UI
        function changeSpeed(speed, btnElement) {
            let ctrl = document.querySelector('[fish-controller]');
            if (ctrl && ctrl.components['fish-controller']) {
                ctrl.components['fish-controller'].setSpeed(speed);
            }

            // อัปเดตสีปุ่ม
            let buttons = document.querySelectorAll('.speed-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }

        .ui-header {
            position: fixed; 
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 99999; 
            color: white;
            font-family: sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
            pointer-events: none; 
        }
        .ui-header h2 { margin: 0; font-size: 24px; }
        .ui-header p { margin: 5px 0; font-size: 16px; color: #f5ead5; }

        .controls-container {
            position: fixed; 
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999; 
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto; 
        }

        .speed-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .speed-btn.active {
            background: #00d2ff;
            color: #002b49;
            border-color: #00d2ff;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <!-- UI ข้อความด้านบน -->
    <div class="ui-header">
        <h2>AR ปลาตะเพียน 3 ตัว</h2>
        <p>ส่องกล้องไปที่ Hiro Marker</p>
    </div>

    <!-- UI ปุ่มควบคุมความเร็วด้านล่าง -->
    <div class="controls-container">
        <button class="speed-btn active" onclick="changeSpeed(1, this)">1 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(2, this)">2 เท่า</button>
        <button class="speed-btn" onclick="changeSpeed(3, this)">3 เท่า</button>
    </div>

    <!-- สร้าง AR Scene และผูก Script คุมปลาตะเพียนทั้งหมด -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true" vr-mode-ui="enabled: false" fish-controller>
        
        <a-assets>
            <!-- อ้างอิงไฟล์รูปการ์ตูนปลา -->
            <img id="fish-texture" src="image_1.png">
        </a-assets>
        
        <a-marker preset="hiro">
            
            <a-entity id="swimming-orbit">
                
                <!-- ============================================== -->
                <!-- ปลาตัวที่ 1: ตำแหน่ง 0 องศา -->
                <!-- ============================================== -->
                <a-entity rotation="0 0 0">
                    <a-entity class="fish-center" position="1.5 1.2 0">
                        <a-image class="fish-image" src="#fish-texture" width="1.5" height="1.5" transparent="true"></a-image>
                    </a-entity>
                </a-entity>

                <!-- ============================================== -->
                <!-- ปลาตัวที่ 2: ตำแหน่งห่างไป 120 องศา -->
                <!-- ============================================== -->
                <a-entity rotation="0 120 0">
                    <a-entity class="fish-center" position="1.5 1.2 0">
                        <a-image class="fish-image" src="#fish-texture" width="1.5" height="1.5" transparent="true"></a-image>
                    </a-entity>
                </a-entity>

                <!-- ============================================== -->
                <!-- ปลาตัวที่ 3: ตำแหน่งห่างไป 240 องศา -->
                <!-- ============================================== -->
                <a-entity rotation="0 240 0">
                    <a-entity class="fish-center" position="1.5 1.2 0">
                        <a-image class="fish-image" src="#fish-texture" width="1.5" height="1.5" transparent="true"></a-image>
                    </a-entity>
                </a-entity>

            </a-entity>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
