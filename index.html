<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Fish Marker (Hiro) - New Fish</title>
  <!-- Load A-Frame and AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <script>
    // Custom component to handle swimming logic and keyboard inputs
    AFRAME.registerComponent('swim-controller', {
      schema: {
        speed: {type: 'number', default: 1} // Initial speed
      },
      init: function () {
        this.currentSpeed = this.data.speed;
        this.angle = 0;

        // Listen for keyboard '+' and '-' keys
        window.addEventListener('keydown', (e) => {
          if (e.key === '+' || e.key === '=') {
            this.currentSpeed *= 2; // Increase speed 2x
            updateSpeedUI(this.currentSpeed);
          } else if (e.key === '-' || e.key === '_') {
            this.currentSpeed /= 2; // Decrease speed 2x
            updateSpeedUI(this.currentSpeed);
          }
        });
      },
      tick: function (time, timeDelta) {
        // Calculate rotation around the center based on current speed and timeDelta
        let rotationAmount = (this.currentSpeed * timeDelta) / 20;
        this.angle -= rotationAmount; // minus so it swims forward assuming left-facing fish

        // Apply rotation to the wrapper entity around the Y-axis
        this.el.setAttribute('rotation', `0 ${this.angle} 0`);
      }
    });

    function updateSpeedUI(speed) {
      const speedUI = document.getElementById('speed-display');
      if (speedUI) {
        speedUI.innerText = "ความเร็วปัจจุบัน: x" + speed;
      }
    }
  </script>
</head>
<body style="margin: 0; overflow: hidden; font-family: sans-serif;">
  
  <!-- UI Overlay -->
  <div style="position: absolute; top: 10px; left: 0; width: 100%; text-align: center; z-index: 10; color: white; text-shadow: 1px 1px 2px black;">
    <h3 style="margin: 5px; background: rgba(0,0,0,0.5); display: inline-block; padding: 10px; border-radius: 10px;">
      ส่องกล้องไปที่ Hiro Marker<br>
      <span style="font-size: 16px;">กดปุ่ม <b>+</b> เพื่อเพิ่มความเร็ว (x2) | กดปุ่ม <b>-</b> เพื่อลดความเร็ว</span><br>
      <span id="speed-display" style="font-size: 16px; color: #ffeb3b;">ความเร็วปัจจุบัน: x1</span>
    </h3>
  </div>

  <!-- AR Scene -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-assets>
      <!-- *** UPDATE: อ้างอิงรูปภาพปลาตะเพียนใหม่ตามที่กำหนด *** -->
      <img id="fish-texture" src="image_1.png">
    </a-assets>

    <!-- Hiro Marker -->
    <a-marker preset="hiro">
      <!-- Container for rotation -> This creates the circular swimming path -->
      <a-entity swim-controller="speed: 1">
        
        <!-- Fish image offset from the center -->
        <!-- รูปปลาตะเพียนหันหน้าไปทางขวา เราจัดตำแหน่งและหมุนให้ตั้งฉากเพื่อให้ดูเหมือนว่ายน้ำ -->
        <a-image 
          src="#fish-texture" 
          position="1.5 0.5 0" 
          rotation="0 90 0" 
          width="1.5" 
          height="1.5"
          transparent="true">
        </a-image>

      </a-entity>
    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
