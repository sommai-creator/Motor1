html_content = """<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR ปลาตะเพียนว่ายน้ำ (Hiro Marker)</title>
    <!-- โหลด A-Frame และ AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        // สร้าง Component สำหรับตรวจจับการคลิกเพื่อเพิ่มความเร็ว
        AFRAME.registerComponent('speed-control', {
            init: function () {
                let isFast = false;
                const orbitEntity = document.querySelector('#orbit-center');
                
                // เมื่อคลิกหรือแตะที่ตัวปลา
                this.el.addEventListener('click', function () {
                    isFast = !isFast;
                    // ความเร็วปกติ = 4000ms ต่อ 1 รอบ, ความเร็ว 2 เท่า = 2000ms ต่อ 1 รอบ
                    const newDuration = isFast ? 2000 : 4000;
                    
                    // อัปเดตความเร็วของ Animation
                    orbitEntity.setAttribute('animation', 'dur', newDuration);
                    
                    console.log(isFast ? "ความเร็ว: 2x" : "ความเร็ว: ปกติ");
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ตั้งค่าฉาก AR -->
    <!-- rayOrigin: mouse ช่วยให้เราสามารถคลิกหรือแตะหน้าจอในมือถือเพื่อ Interact ได้ -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <!-- กำหนด Marker (ใช้ Hiro Marker) -->
        <a-marker preset="hiro">
            
            <!-- จุดศูนย์กลางสำหรับการว่ายวน (Orbit) -->
            <!-- property: rotation ให้หมุนรอบแกน Y (0 360 0), dur: 4000 คือเวลาต่อรอบ (4 วินาที) -->
            <a-entity id="orbit-center" 
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
                
                <!-- ตัวปลาตะเพียน (ขยับห่างจากจุดศูนย์กลางมา 1.5 หน่วย เพื่อให้ว่ายเป็นวงกลม) -->
                <!-- class="clickable" เพื่อให้ raycaster ตรวจจับการคลิกได้ -->
                <a-entity position="1.5 0 0" 
                          rotation="0 90 0" 
                          class="clickable" 
                          speed-control>
                    
                    <!-- 
                        *** หมายเหตุ ***
                        ตรงนี้ใช้รูปทรงเรขาคณิต (กรวย+สามเหลี่ยม) เป็นตัวแทนปลาชั่วคราว
                        หากคุณมีไฟล์ 3D โมเดลปลาตะเพียน (เช่น .gltf) สามารถลบ a-cone และ a-triangle ออก 
                        แล้วใช้โค้ดด้านล่างนี้แทน:
                        <a-gltf-model src="path/to/your/fish.gltf" scale="0.5 0.5 0.5"></a-gltf-model>
                    -->
                    
                    <!-- ลำตัวปลา (Placeholder) -->
                    <a-cone color="#FFD700" radius-bottom="0.4" radius-top="0" height="1.2" rotation="-90 0 0"></a-cone>
                    <!-- หางปลา (Placeholder) -->
                    <a-triangle color="#FFA500" vertex-a="0 0.5 0" vertex-b="-0.3 -0.3 0" vertex-c="0.3 -0.3 0" position="0 0 -0.8" rotation="-90 0 0"></a-triangle>
                    
                    <!-- ข้อความลอยอยู่บนตัวปลาเพื่อให้รู้ว่ากดได้ -->
                    <a-text value="Tap Me!" position="0 1 0" align="center" scale="1 1 1" color="#FF0000" rotation="-90 0 0"></a-text>

                </a-entity>
            </a-entity>

        </a-marker>

        <!-- กล้องสำหรับมองฉาก AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
"""

file_path = "ar_fish_swimming.html"
with open(file_path, "w", encoding="utf-8") as f:
    f.write(html_content)

file_path
