html_content = """<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR ปลาตะเพียนทอง & ปุ่มเพิ่มความเร็ว</title>
    <!-- โหลดเฟรมเวิร์ก WebAR (A-Frame และ AR.js) ที่เสถียรที่สุด -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script>
        // สร้าง Component สำหรับตรวจจับการคลิกเพื่อเพิ่มความเร็ว
        AFRAME.registerComponent('speed-control', {
            init: function () {
                let isFast = false;
                const orbitEntity = document.querySelector('#orbit-center');
                
                // เมื่อคลิกหรือแตะที่ตัวปลา
                this.el.addEventListener('click', function () {
                    isFast = !isFast;
                    // ความเร็วปกติ = 4000ms ต่อ 1 รอบ, ความเร็ว 2 เท่า = 2000ms ต่อ 1 รอบ
                    const newDuration = isFast ? 2000 : 4000;
                    
                    // อัปเดตความเร็วของ Animation
                    orbitEntity.setAttribute('animation', 'dur', newDuration);
                    
                    console.log(isFast ? "ความเร็ว: 2x" : "ความเร็ว: ปกติ");
                });
            }
        });
    </script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- ตั้งค่าฉาก AR -->
    <!-- rayOrigin: mouse ช่วยให้เราสามารถคลิกหรือแตะหน้าจอในมือถือเพื่อ Interact ได้ -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        
        <!-- กำหนด Marker (ใช้ Hiro Marker พื้นฐาน) -->
        <a-marker preset="hiro">
            
            <!-- จุดศูนย์กลางสำหรับการว่ายวน (Orbit) -->
            <!-- property: rotation ให้หมุนรอบแกน Y (0 360 0), dur: 4000 คือเวลาต่อรอบ (4 วินาที) -->
            <a-entity id="orbit-center" 
                      animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
                
                <!-- ตัวปลาตะเพียนทอง ( offset ห่างจากศูนย์กลางและยกสูง ) -->
                <!-- class="clickable" และ speed-control อยู่ที่ตัวปลาเพื่อให้กดได้ -->
                <a-entity position="1.5 0.5 0">
                    
                    <!-- 
                        *** ใช้รูปภาพแทนโมเดล 3D ***
                        ใช้ <a-image> ชี้ไปยังไฟล์รูปภาพ
                        กำหนดค่าตำแหน่ง, การหมุน, และขนาดให้เหมาะสม
                        เพื่อให้หันหน้าไปในทิศทางเดียวกับการว่าย
                    -->
                    <a-image src="image_1.png" 
                             class="clickable" 
                             speed-control
                             position="0 0 0" 
                             rotation="0 90 0" 
                             scale="0.8 0.8 0.8"></a-image>
                    
                    <!-- ข้อความลอยอยู่บนตัวปลาเพื่อให้รู้ว่ากดได้ -->
                    <a-text value="Tap Me!" position="0 0.8 0" align="center" scale="1 1 1" color="#FF0000" rotation="0 0 0"></a-text>

                </a-entity>
            </a-entity>

        </a-marker>

        <!-- กล้องสำหรับมองฉาก AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
"""

file_path = "ar_pla_tapian_gold.html"
with open(file_path, "w", encoding="utf-8") as f:
    f.write(html_content)

file_path
