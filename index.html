html_content = """<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR ปลาตะเพียนทอง & ปุ่มเพิ่มความเร็ว</title>
    <!-- โหลดเฟรมเวิร์ก WebAR (A-Frame และ AR.js) ที่เสถียรที่สุด -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* สไตล์สำหรับปุ่ม UI แบบ Overlay ให้ลอยอยู่เหนือหน้ากล้อง */
        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999; /* ให้ลอยเหนือทุกอย่าง */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            pointer-events: none; /* ป้องกันการบล็อกการสัมผัสหน้าจอส่วนอื่น */
        }
        #speedBtn {
            pointer-events: auto; /* ให้เฉพาะปุ่มนี้สามารถคลิก/แตะได้ */
            padding: 15px 40px;
            font-size: 22px;
            font-family: 'Kanit', sans-serif, Arial;
            font-weight: bold;
            color: white;
            background-color: #ff9800; /* สีส้ม */
            border: 3px solid #fff;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #speedBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; font-family: sans-serif;">

    <!-- ส่วน UI ปุ่มกดบนหน้าจอ (แยกจาก 3D AR) -->
    <div class="ui-container">
        <button id="speedBtn">🚀 เพิ่มความเร็ว (x2)</button>
    </div>

    <script>
        // ควบคุมการกดปุ่มเพื่อเปลี่ยนความเร็ว Animation
        document.addEventListener("DOMContentLoaded", function() {
            const btn = document.getElementById("speedBtn");
            const orbitEntity = document.getElementById("orbit-center");
            const fishImage = document.getElementById("fish");
            let isFast = false;

            btn.addEventListener("click", function() {
                isFast = !isFast;
                
                if (isFast) {
                    // เร็วขึ้น 2 เท่า (ลดเวลาต่อ 1 รอบลงครึ่งหนึ่ง จาก 4000ms เป็น 2000ms)
                    orbitEntity.setAttribute("animation", "dur", 2000);
                    btn.innerHTML = "🐢 ลดความเร็ว (ปกติ)";
                    btn.style.backgroundColor = "#4CAF50"; // เปลี่ยนปุ่มเป็นสีเขียว
                } else {
                    // กลับไปความเร็วปกติ
                    orbitEntity.setAttribute("animation", "dur", 4000);
                    btn.innerHTML = "🚀 เพิ่มความเร็ว (x2)";
                    btn.style.backgroundColor = "#ff9800"; // กลับเป็นสีส้ม
                }
            });
        });
    </script>

    <!-- ตั้งค่าฉาก AR -->
    <!-- arjs="sourceType: webcam; debugUIEnabled: false;" คือการตั้งค่าให้ใช้กล้องเว็บบนเบราว์เซอร์ -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- ใช้ Hiro Marker พื้นฐาน -->
        <a-marker preset="hiro">
            
                <!-- จุดศูนย์กลางหมุนรอบตัวเอง (Orbit) 
                     เพื่อให้ปลาว่ายวนรอบๆ Marker -->
                <a-entity id="orbit-center" 
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
                    
                    <!-- 
                        โมเดลปลาตะเพียนทอง (Pla Tapian Tong) จากรูปภาพที่ลบข้อความแล้ว
                        ใช้ <a-image> แทน <a-gltf-model> เพื่อแสดงรูปภาพ PNG โปร่งใส
                        กำหนดค่าตำแหน่ง, การหมุน, และขนาดให้เหมาะสม
                    -->
                    <a-image id="fish" src="pla_tapian_clean.png" position="1.5 0.5 0" rotation="-90 0 0" scale="1 1 1"></a-image>

                </a-entity>
        </a-marker>

        <!-- กล้องสำหรับฉาก AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
"""

# บันทึกไฟล์ HTML และภาพที่สะอาดแล้ว
with open("pla_tapian_ar.html", "w", encoding="utf-8") as f:
    f.write(html_content)

# เราไม่สามารถบันทึกไฟล์ภาพโดยตรงได้ ดังนั้นเราจึงให้ลิงก์ดาวน์โหลดพร้อมคำอธิบาย
