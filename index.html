html_content = """<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR ปลาตะเพียนสาน & ปุ่มเพิ่มความเร็ว</title>
    <!-- โหลด A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* สไตล์สำหรับปุ่ม UI แบบ Overlay ให้ลอยอยู่เหนือหน้ากล้อง */
        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            pointer-events: none; /* ป้องกันการบล็อกการสัมผัสหน้าจอส่วนอื่น */
        }
        #speedBtn {
            pointer-events: auto; /* ให้เฉพาะปุ่มนี้สามารถคลิก/แตะได้ */
            padding: 15px 40px;
            font-size: 22px;
            font-family: 'Kanit', sans-serif, Arial;
            font-weight: bold;
            color: white;
            background-color: #ff9800; /* สีส้ม */
            border: 3px solid #fff;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #speedBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden; font-family: sans-serif;">

    <!-- ส่วน UI ปุ่มกดบนหน้าจอ (แยกจาก 3D AR) -->
    <div class="ui-container">
        <button id="speedBtn">🚀 เพิ่มความเร็ว (x2)</button>
    </div>

    <script>
        // ควบคุมการกดปุ่มเพื่อเปลี่ยนความเร็ว Animation
        document.addEventListener("DOMContentLoaded", function() {
            const btn = document.getElementById("speedBtn");
            const orbitEntity = document.getElementById("orbit-center");
            let isFast = false;

            btn.addEventListener("click", function() {
                isFast = !isFast;
                
                if (isFast) {
                    // เร็วขึ้น 2 เท่า (ลดเวลาต่อ 1 รอบลงครึ่งหนึ่ง จาก 4000ms เป็น 2000ms)
                    orbitEntity.setAttribute("animation", "dur", 2000);
                    btn.innerHTML = "🐢 ลดความเร็ว (ปกติ)";
                    btn.style.backgroundColor = "#4CAF50"; // เปลี่ยนปุ่มเป็นสีเขียว
                } else {
                    // กลับไปความเร็วปกติ
                    orbitEntity.setAttribute("animation", "dur", 4000);
                    btn.innerHTML = "🚀 เพิ่มความเร็ว (x2)";
                    btn.style.backgroundColor = "#ff9800"; // กลับเป็นสีส้ม
                }
            });
        });
    </script>

    <!-- ตั้งค่าฉาก AR -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- ใช้ Hiro Marker -->
        <a-marker preset="hiro">
            
                <!-- จุดศูนย์กลางหมุนรอบตัวเอง (Orbit) 
                     เพื่อให้ปลาว่ายวนรอบๆ Marker -->
                <a-entity id="orbit-center" 
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear;">
                    
                    <!-- โครงสร้างโมเดล "ปลาตะเพียนสาน" (Woven Palm Leaf Fish) -->
                    <!-- ห่างจากศูนย์กลาง 1.5 หน่วย ลอยสูง 0.5 หน่วย -->
                    <a-entity position="1.5 0.5 0">
                        
                        <!-- 1. ลำตัวปลา (รูปทรงสี่เหลี่ยมข้าวหลามตัดแบนๆ) -->
                        <a-entity geometry="primitive: octahedron" 
                                  scale="0.1 0.5 0.8" 
                                  material="color: #f1c40f; roughness: 0.8"></a-entity>

                        <!-- 2. หางปลา (ด้านหลังสุด / แกน +Z) -->
                        <a-triangle vertex-a="0 0 0.6" vertex-b="0 0.4 0" vertex-c="0 -0.4 0" 
                                    position="0 0 0.7" 
                                    material="color: #e67e22; side: double"></a-triangle>

                        <!-- 3. ครีบบน -->
                        <a-triangle vertex-a="0 0.4 0" vertex-b="0 0 -0.3" vertex-c="0 0 0.3" 
                                    position="0 0.45 0" 
                                    material="color: #e67e22; side: double"></a-triangle>

                        <!-- 4. ครีบล่าง -->
                        <a-triangle vertex-a="0 -0.4 0" vertex-b="0 0 -0.3" vertex-c="0 0 0.3" 
                                    position="0 -0.45 0" 
                                    material="color: #e67e22; side: double"></a-triangle>

                        <!-- 5. ตาซ้าย (ด้านหน้า / แกน -Z) -->
                        <a-sphere radius="0.04" position="0.1 0.1 -0.5" material="color: #2c3e50"></a-sphere>
                        <!-- 6. ตาขวา -->
                        <a-sphere radius="0.04" position="-0.1 0.1 -0.5" material="color: #2c3e50"></a-sphere>
                        
                    </a-entity>

                </a-entity>
        </a-marker>

        <!-- กล้องสำหรับฉาก AR -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
"""

file_path = "ar_pla_tapian-v2.html"
with open(file_path, "w", encoding="utf-8") as f:
    f.write(html_content)

file_path
